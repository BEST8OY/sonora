name: Linux Build

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - "docs/**"
      - "*.md"
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - "docs/**"
      - "*.md"
  workflow_dispatch:

concurrency:
  group: linux-build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_RELEASE_STRIP: symbols
  RUST_BACKTRACE: 1
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  build:
    name: Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            arch: x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            arch: aarch64

    steps:
      - uses: actions/checkout@v5

      - name: system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake mold patchelf file desktop-file-utils \
            libasound2-dev libfontconfig1-dev libfreetype-dev libsqlite3-dev \
            libx11-dev libxcb1-dev libxcursor-dev libxi-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libvulkan-dev libdbus-1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: mozilla-actions/sccache-action@v0.0.9

      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-build-${{ matrix.target }}
          cache-targets: false
          cache-on-failure: true

      - name: build
        run: cargo build --release --locked --package sonora --target ${{ matrix.target }}

      - name: sccache stats
        if: always()
        run: sccache --show-stats

      - name: stage standalone binary and archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          short_sha="${GITHUB_SHA:0:7}"
          
          # Standalone executable
          cp "target/${{ matrix.target }}/release/sonora" "dist/sonora-${short_sha}-${{ matrix.arch }}"
          chmod +x "dist/sonora-${short_sha}-${{ matrix.arch }}"

          # Portable tarball with desktop integration and icons
          pkg="sonora-${short_sha}-${{ matrix.arch }}"
          mkdir -p "$pkg/bin" "$pkg/share/applications" "$pkg/share/icons"
          cp "target/${{ matrix.target }}/release/sonora" "$pkg/bin/sonora"
          chmod +x "$pkg/bin/sonora"
          cp assets/linux/sonora.desktop "$pkg/share/applications/"
          cp -R assets/linux/icons/hicolor "$pkg/share/icons/"
          cp COPYING "$pkg/LICENSE"
          tar -czvf "dist/${pkg}.tar.gz" "$pkg"
          rm -rf "$pkg"

      - name: build AppImage
        continue-on-error: true
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:7}"

          mkdir -p AppDir/usr/bin AppDir/usr/share/icons desktop
          cp "target/${{ matrix.target }}/release/sonora" AppDir/usr/bin/sonora
          chmod +x AppDir/usr/bin/sonora
          cp -R assets/linux/icons/hicolor AppDir/usr/share/icons/

          cp assets/linux/sonora.desktop desktop/sonora.desktop
          {
            echo "X-AppImage-Name=Sonora"
            echo "X-AppImage-Arch=$ARCH"
            echo "X-AppImage-Version=$short_sha"
          } >> desktop/sonora.desktop
          desktop-file-validate desktop/sonora.desktop

          # Copy licenses and notices
          mkdir -p AppDir/usr/share/doc/sonora/icons
          cp COPYING AppDir/usr/share/doc/sonora/LICENSE
          cp THIRD-PARTY.md AppDir/usr/share/doc/sonora/
          cp assets/fonts/LICENSE.txt AppDir/usr/share/doc/sonora/LICENSE.Inter
          cp assets/icons/LICENSE AppDir/usr/share/doc/sonora/icons/LICENSE
          for licence in assets/icons/*/LICENSE; do
            pack="$(basename "$(dirname "$licence")")"
            cp "$licence" "AppDir/usr/share/doc/sonora/icons/LICENSE.$pack"
          done

          # Fetch AppImage packaging tooling
          base=https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous
          curl -fsSL -o linuxdeploy "$base/linuxdeploy-$ARCH.AppImage"
          base=https://github.com/AppImage/appimagetool/releases/download/continuous
          curl -fsSL -o appimagetool "$base/appimagetool-$ARCH.AppImage"
          chmod +x linuxdeploy appimagetool

          ./linuxdeploy \
            --appdir AppDir \
            --executable AppDir/usr/bin/sonora \
            --desktop-file desktop/sonora.desktop \
            --icon-file assets/linux/sonora.svg

          # Host loader is required for Vulkan ICD driver resolution
          rm -f AppDir/usr/lib/libvulkan.so.1*

          ./appimagetool AppDir "dist/Sonora-${short_sha}-$ARCH.AppImage"

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sonora-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
